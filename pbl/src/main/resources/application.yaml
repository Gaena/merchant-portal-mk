spring:
  application:
    name: pbl
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    # No default on purpose: the service must not start with a guessable database password.
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

pbl:
  dashboard:
    # Zone the statistics cut days and hours in (P3-7). Not UTC: payments after 20:00 Baku time would
    # land on the next day. The offset must be a whole number of hours (DashboardService.foldBuckets).
    zone: ${PBL_DASHBOARD_ZONE:Asia/Baku}
  # Public URL as the payer's browser sees it; sent to the acquirer as hppRedirectUrl. No default on
  # purpose (P1-10): a default would silently send production payers to localhost.
  base-url: ${PBL_BASE_URL}
  security:
    # Static token = SYSTEM_ADMIN without a password. Off and empty by default: a built-in value would
    # be a publicly known backdoor. Enabling it without PBL_API_TOKEN fails startup.
    api-token: ${PBL_API_TOKEN:}
    api-token-enabled: ${PBL_API_TOKEN_ENABLED:false}
    # Must be byte-for-byte the same value as in auth, directory and ecom. No default on purpose.
    jwt:
      secret: ${JWT_SECRET}
      # Only auth stamps the lifetime into tokens; kept equal to it (P1-13) so the four configs match.
      expiration-ms: ${JWT_EXPIRATION_MS:900000} # 15 minutes
  link:
    # Lifetime of a link created without expiresAt (P1-9).
    default-ttl: ${PBL_LINK_DEFAULT_TTL:PT24H}
    # Ceiling counted from the link's CREATION, on create and on every PATCH: counted from "now", a
    # chain of PATCHes would extend the expiry forever (P1-9).
    max-ttl: ${PBL_LINK_MAX_TTL:P90D}
  link-expiry:
    # ACTIVE links past expiresAt -> EXPIRED every 5 minutes. Opening checks the expiry by itself.
    enabled: ${PBL_LINK_EXPIRY_ENABLED:true}
  reconciliation:
    # Sweep of PENDING rows the payer never returned from: the acquirer has no callback (Р-7).
    enabled: ${PBL_RECONCILIATION_ENABLED:true}
    cron: "${PBL_RECONCILIATION_CRON:0 */2 * * * *}"
    # Younger rows are left to the payer's return page, which refreshes them itself.
    min-age: ${PBL_RECONCILIATION_MIN_AGE:PT2M}
    # Past this age a still-unpaid order is treated as abandoned by the payer.
    max-age: ${PBL_RECONCILIATION_MAX_AGE:PT24H}
    # Past this age a row is no longer polled (P1-8a): UNKNOWN and SETTLED_OTHER rows never time out
    # into FAILED and would fill every batch. They need a human; their count is logged every run.
    give-up-age: ${PBL_RECONCILIATION_GIVE_UP_AGE:P7D}
    batch-size: ${PBL_RECONCILIATION_BATCH_SIZE:50}
  provider:
    # No defaults on purpose (P1-10): a test-stand fallback in production routes payments to the test
    # acquirer. gateway — payment page and createEcomOrder; api — exec-tran and order status.
    gateway-base-url: ${PROVIDER_GATEWAY_BASE_URL}
    api-base-url: ${PROVIDER_API_BASE_URL}
    # Protocol constants, so defaults are fine. Quoted: a bare `{` starts a YAML flow mapping.
    create-order-path: "${PROVIDER_CREATE_ORDER_PATH:/order}"
    exec-tran-path: "${PROVIDER_EXEC_TRAN_PATH:/order/{orderId}/exec-tran}"
    get-order-path: "${PROVIDER_GET_ORDER_PATH:/order/{orderId}}"

mp:
  # Forwarding headers are believed only from these addresses — nginx on loopback (P2-10).
  # Empty = never believe them.
  trusted-proxies: ${TRUSTED_PROXIES:127.0.0.1,::1}
  credentials:
    # Ключ AES-256 для паролей компаний к провайдеру (Р-93): 32 байта в base64, одно значение в directory
    # и pbl — directory шифрует, pbl расшифровывает. Без значения по умолчанию намеренно (CredentialCipher).
    encryption-key: ${CREDENTIALS_ENCRYPTION_KEY}

management:
  server:
    # Actuator on a loopback-only port: it has no token protection, and probes have none to present.
    # Ports: auth 9081, directory 9082, pbl 9080, ecom 9083.
    port: ${MANAGEMENT_PORT:9080}
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      # Safe only thanks to the loopback binding above: details are visible from this machine only.
      show-details: always

springdoc:
  # Off in operation: /v3/api-docs is a full map of the API. SWAGGER_ENABLED=true only for acceptance
  # testing (project_docs/guides/deployment_guide.md); while off, SecurityConfig opens no paths for it.
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html

resilience4j:
  circuitbreaker:
    instances:
      acquiring:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000ms
        permittedNumberOfCallsInHalfOpenState: 3
        # Отказ шлюза конкретному терминалу — не сбой шлюза: не размыкает приём платежей всем.
        ignoreExceptions:
          - az.millikart.txpg.AcquirerDeclinedException
  retry:
    instances:
      acquiring:
        maxAttempts: 3
        waitDuration: 500ms
        # Повтор отказа даёт тот же отказ.
        ignoreExceptions:
          - az.millikart.txpg.AcquirerDeclinedException


