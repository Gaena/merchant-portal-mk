<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Status</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-color: #ffffff;
            --text-muted: #8a99ad;
            --primary-glow: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(0,0,0,0) 70%);
            --accent-color: #6366f1;
            --success-color: #10b981;
            --error-color: #ef4444;
            --receipt-bg: #141b2d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            padding: 20px;
        }

        body::before {
            content: '';
            position: absolute;
            width: 650px;
            height: 650px;
            background: var(--primary-glow);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 460px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: all 0.4s ease;
        }

        .status-icon-wrapper {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .spinner {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid rgba(99, 102, 241, 0.1);
            border-top: 3px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
        }

        .pulse-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: var(--accent-color);
            opacity: 0.1;
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        .status-icon {
            font-size: 32px;
            z-index: 2;
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 24px;
        }

        /* Receipt view styling */
        .receipt {
            display: none;
            background: var(--receipt-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: left;
            position: relative;
            overflow: hidden;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .receipt-header {
            text-align: center;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 24px;
            margin-bottom: 24px;
        }

        .receipt-logo {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .receipt-title {
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .receipt-status-badge {
            display: inline-block;
            padding: 6px 12px;
            font-size: 11px;
            font-weight: 700;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 8px;
        }

        .status-paid {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--success-color);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-hold {
            background-color: rgba(99, 102, 241, 0.15);
            color: var(--accent-color);
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .receipt-amount-section {
            text-align: center;
            margin-bottom: 24px;
        }

        .receipt-amount-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .receipt-amount-val {
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
        }

        .receipt-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 14px;
            font-size: 13px;
        }

        .receipt-label {
            color: var(--text-muted);
        }

        .receipt-value {
            font-weight: 600;
            text-align: right;
            max-width: 60%;
            word-break: break-all;
        }

        .receipt-divider {
            border-top: 1px dashed var(--border-color);
            margin: 20px 0;
        }

        .actions-group {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: white;
        }

        .btn-primary:hover {
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .btn-error {
            background-color: var(--error-color);
            color: white;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.1; }
            50% { transform: scale(1.15); opacity: 0.2; }
        }

        @keyframes pulse-success {
            0% { transform: scale(1); opacity: 0.2; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        @keyframes pulse-error {
            0% { transform: scale(1); opacity: 0.2; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        @media print {
            body {
                background: #ffffff;
                color: #000000;
            }
            body::before { display: none; }
            .receipt {
                border: none;
                box-shadow: none;
                background: #ffffff;
                color: #000000;
                padding: 0;
            }
            .receipt-amount-val, .receipt-value {
                color: #000000;
            }
            .actions-group {
                display: none;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Card 1: Processing Loader & Error view -->
    <div class="card" id="statusCard">
        <div class="status-icon-wrapper">
            <div class="pulse-ring" id="pulseRing"></div>
            <div class="spinner" id="spinner"></div>
            <div class="status-icon" id="statusIcon">🔒</div>
        </div>
        <h1 id="statusTitle">Checking payment status</h1>
        <p id="statusDesc">Please wait a moment while we verify your transaction details with the provider.</p>
        <button class="btn btn-primary" style="display:none;" id="failBtn" onclick="closePage()">Close Page</button>
    </div>

    <!-- Card 2: Receipt View (Shown only on success/hold status) -->
    <div class="receipt" id="receiptCard">
        <div class="receipt-header">
            <div class="receipt-logo">💳</div>
            <div class="receipt-title">Transaction Receipt</div>
            <span class="receipt-status-badge" id="receiptBadge">PAID</span>
        </div>

        <div class="receipt-amount-section">
            <div class="receipt-amount-label">Amount Paid</div>
            <div class="receipt-amount-val" id="receiptAmount">0.00 AZN</div>
        </div>

        <div class="receipt-row">
            <div class="receipt-label">Order Reference</div>
            <div class="receipt-value" id="receiptOrderId">-</div>
        </div>
        <div class="receipt-row">
            <div class="receipt-label">Transaction ID</div>
            <div class="receipt-value" id="receiptTxId">-</div>
        </div>
        <div class="receipt-row">
            <div class="receipt-label">Date & Time</div>
            <div class="receipt-value" id="receiptDate">-</div>
        </div>

        <div class="receipt-divider"></div>

        <div class="receipt-row" id="receiptDescRow">
            <div class="receipt-label">Description</div>
            <div class="receipt-value" id="receiptDesc">-</div>
        </div>
        <div class="receipt-row" id="receiptCustomerRow">
            <div class="receipt-label">Customer</div>
            <div class="receipt-value" id="receiptCustomerName">-</div>
        </div>

        <div class="actions-group">
            <button class="btn btn-secondary" onclick="window.print()">Print Receipt</button>
            <button class="btn btn-primary" id="returnBtn" onclick="closePage()">Close Page</button>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const providerOrderId = [[${providerOrderId}]];
    let pollCount = 0;
    const maxPolls = 15;

    async function checkStatus() {
        pollCount++;
        try {
            const response = await fetch(`/api/v1/transactions/${providerOrderId}/status`);
            if (!response.ok) {
                throw new Error("Failed to check status");
            }
            const data = await response.json();

            if (data.status === "SUCCESS" || data.status === "AUTHORIZED") {
                showReceipt(data);
            } else if (data.status === "FAILED") {
                showError("Payment Failed", "The provider declined the payment. Please try again or use another payment method.");
            } else {
                if (pollCount >= maxPolls) {
                    showError("Verification Timeout", "We did not receive a final status from the provider. Please check with your bank if funds were deducted.");
                } else {
                    setTimeout(checkStatus, 2000);
                }
            }
        } catch (error) {
            console.error("Status check failed:", error);
            if (pollCount >= maxPolls) {
                showError("Connection Error", "Could not verify payment status due to a connection issue.");
            } else {
                setTimeout(checkStatus, 2500);
            }
        }
    }

    function showReceipt(data) {
        // Hide processing loader card
        document.getElementById("statusCard").style.display = "none";

        // Fill receipt data
        const badge = document.getElementById("receiptBadge");
        if (data.status === "AUTHORIZED") {
            badge.innerText = "Authorized (Hold)";
            badge.className = "receipt-status-badge status-hold";
        } else {
            badge.innerText = "Paid";
            badge.className = "receipt-status-badge status-paid";
        }

        document.getElementById("receiptAmount").innerText = `${Number(data.amount).toFixed(2)} ${data.currency}`;
        document.getElementById("receiptOrderId").innerText = data.merchantOrderId || "-";
        document.getElementById("receiptTxId").innerText = data.id;

        // Format Date
        const dateStr = data.createdAt ? new Date(data.createdAt).toLocaleString() : new Date().toLocaleString();
        document.getElementById("receiptDate").innerText = dateStr;

        // Optional Description
        if (data.description) {
            document.getElementById("receiptDesc").innerText = data.description;
            document.getElementById("receiptDescRow").style.display = "flex";
        } else {
            document.getElementById("receiptDescRow").style.display = "none";
        }

        // Optional Customer Name/Contact
        if (data.customerName) {
            let customerInfo = data.customerName;
            if (data.customerEmail) customerInfo += ` (${data.customerEmail})`;
            document.getElementById("receiptCustomerName").innerText = customerInfo;
            document.getElementById("receiptCustomerRow").style.display = "flex";
        } else {
            document.getElementById("receiptCustomerRow").style.display = "none";
        }

        // Show receipt card
        document.getElementById("receiptCard").style.display = "block";
    }

    function showError(title, message) {
        document.getElementById("spinner").style.borderColor = "transparent";
        document.getElementById("spinner").style.borderTopColor = "transparent";
        document.getElementById("spinner").style.animation = "none";
        document.getElementById("pulseRing").style.backgroundColor = "var(--error-color)";
        document.getElementById("statusIcon").innerHTML = "❌";

        document.getElementById("statusTitle").innerText = title;
        document.getElementById("statusDesc").innerText = message;
        document.getElementById("failBtn").style.display = "inline-flex";
    }

    function closePage() {
        alert("You may now close this browser tab.");
        window.close();
    }

    // Start polling
    window.addEventListener("DOMContentLoaded", () => {
        setTimeout(checkStatus, 1000);
    });
</script>

</body>
</html>
