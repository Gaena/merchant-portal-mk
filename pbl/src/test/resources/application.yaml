spring:
  datasource:
    url: jdbc:h2:mem:pbl;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      # Build and validate schema using Liquibase migrations on test startup.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

# PayByLink service configuration (test values)
pbl:
  dashboard:
    # Same value as production: the window and bucket tests assert Baku days, and a test-only zone
    # would mean the suite checks a configuration nobody runs.
    zone: Asia/Baku
  base-url: https://pay.example.com/
  receipt:
    provider-name: Test Payment Provider LLC
    provider-tax-id: "1700000001"
  security:
    # No test uses the static fallback token, and leaving it enabled would demand a real value.
    api-token-enabled: false
    jwt:
      # Test-only key, identical in auth/directory/pbl test configs. Never used by a running service.
      secret: test-only-jwt-secret-not-used-anywhere-else-0123456789
  link:
    # Same values as production: the TTL tests assert against these, and a test-only lifetime would
    # mean the suite checks a configuration nobody runs. Scenarios that need a different window set
    # expiresAt explicitly instead.
    default-ttl: PT24H
    max-ttl: P90D
  link-expiry:
    # Off like the sweep below: every five minutes it would expire other tests' fixtures.
    # PaymentLinkIntegrationTest calls the scheduler method itself.
    enabled: false
  reconciliation:
    # Off by default so the sweep never races the fixtures of the other integration tests.
    # TransactionReconciliationIntegrationTest drives the service directly instead.
    enabled: false
    cron: "0 */2 * * * *"
    min-age: PT2M
    max-age: PT24H
    give-up-age: P7D
    # Small on purpose: TransactionReconciliationIntegrationTest.reconcile_respectsBatchSize overflows it.
    batch-size: 3
  provider:
    gateway-base-url: https://gateway.txpg.example.com/pay
    api-base-url: https://api.txpg.example.com/pay
    # Protocol paths are the production defaults (ConfigurationExternalizationTest keeps them equal).
    create-order-path: /order
    exec-tran-path: /order/{orderId}/exec-tran
    get-order-path: /order/{orderId}

# Mirrors production (src/main/resources/application.yaml): actuator on its own port, swagger off.
# The tests drive the main port through MockMvc, which never boots the management child context —
# so /actuator/** answers 404 here, exactly as it does on the public port of a running service,
# and no port is bound during the build. ManagementPortIntegrationTest overrides this with port 0
# to check the management port itself on a real container.
mp:
  audit:
    # Тот же ключ во всех модулях, как ключ подписи токенов; нигде больше не используется.
    chain-key: test-only-audit-chain-key-not-used-anywhere-else-0123456789
    # Запуск и остановка сервиса в журнале (Р-136) — не в тестах: контекст живёт весь прогон, и его записи
    # попадали бы в счёт журнала чужих тестов. Слушатель проверяет ServiceLifecycleAuditTest в common.
    lifecycle:
      enabled: false
  # Same as production: MockMvc reports 127.0.0.1 as the peer, so it counts as a trusted proxy.
  trusted-proxies: 127.0.0.1,::1
  credentials:
    # Test-only key, identical in directory/pbl test configs and CredentialCipherTest.
    encryption-key: dGVzdC1vbmx5LWNyZWRlbnRpYWxzLWtleS0wMTIzNDU=

management:
  server:
    port: 9080
    address: 127.0.0.1

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false