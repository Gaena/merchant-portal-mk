plugins {
    id 'org.springframework.boot'
}

dependencies {
    implementation project(':common')
    // Клиент провайдера; resilience4j и AOP для его @CircuitBreaker/@Retry приходят вместе с ним.
    implementation project(':txpg-client')
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.liquibase:liquibase-core'
    compileOnly 'org.projectlombok:lombok:1.18.30'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Тесты схемы, миграций и конкурентности идут на настоящей PostgreSQL в контейнере:
    // H2 в режиме совместимости их вопросы не проверяет. См. common PostgresTestContainer.
    testImplementation testFixtures(project(':common'))
    // StubAcquiringClient — тестовый двойник эквайера.
    testImplementation testFixtures(project(':txpg-client'))
}
