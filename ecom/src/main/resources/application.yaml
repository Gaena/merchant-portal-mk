spring:
  application:
    name: ecom
  datasource:
    # Наша PostgreSQL, общая с остальными сервисами: слепки справочников провайдера и журнал аудита.
    # Платёжных данных провайдера в ней быть не должно.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    # No default on purpose: the service must not start with a guessable database password.
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

ecom:
  txpg:
    # Меняется от контура к контуру, поэтому не константа в SQL.
    schema: ${ECOM_TXPG_SCHEMA:TXPG}
    # Предохранители: отчётный запрос конкурирует с авторизациями на боевом шлюзе.
    max-window: ${ECOM_TXPG_MAX_WINDOW:P92D}
    max-page-size: ${ECOM_TXPG_MAX_PAGE_SIZE:200}
    # Сколько заказов страница с фильтром по статусу просматривает за один запрос (Р-87).
    status-scan-limit: ${ECOM_TXPG_STATUS_SCAN_LIMIT:1000}
    query-timeout: ${ECOM_TXPG_QUERY_TIMEOUT:PT30S}
    fetch-size: ${ECOM_TXPG_FETCH_SIZE:200}
    # Даты в базе шлюза хранятся местным временем без пояса; этим поясом они читаются и
    # в нём же режутся границы периода. Ошибка сдвигает всю выписку на разницу поясов.
    zone: ${ECOM_TXPG_ZONE:Asia/Baku}
    missing-runs-before-disable: ${ECOM_TXPG_MISSING_RUNS:3}
    datasource:
      # Без значений по умолчанию намеренно: сервис не должен подниматься, молча целясь
      # в localhost, — это чужая база, и адрес у каждого контура свой.
      url: ${ECOM_TXPG_URL}
      driver-class-name: oracle.jdbc.OracleDriver
      username: ${ECOM_TXPG_USERNAME}
      password: ${ECOM_TXPG_PASSWORD}
      hikari:
        # Маленький пул намеренно: пока провайдер не дал читающую реплику, каждое наше
        # соединение отнимает ресурс у боевых авторизаций.
        maximum-pool-size: ${ECOM_TXPG_POOL_SIZE:4}
        connection-timeout: 10000

  provider:
    # Те же переменные, что у pbl (Р-124): адрес провайдера один на портал. Без умолчаний (P1-10): чужой
    # контур по ошибке — деньги на чужом стенде. Пути — константы протокола.
    gateway-base-url: ${PROVIDER_GATEWAY_BASE_URL}
    api-base-url: ${PROVIDER_API_BASE_URL}
    create-order-path: "${PROVIDER_CREATE_ORDER_PATH:/order}"
    exec-tran-path: "${PROVIDER_EXEC_TRAN_PATH:/order/{orderId}/exec-tran}"
    get-order-path: "${PROVIDER_GET_ORDER_PATH:/order/{orderId}}"

  terminal-sync:
    # Расписанием, а не при входе администратора: иначе аутентификация зависела бы от чужой базы.
    enabled: ${ECOM_TERMINAL_SYNC_ENABLED:true}
    cron: "${ECOM_TERMINAL_SYNC_CRON:0 */15 * * * *}"

# Ключ `pbl`, а не `ecom`: JwtProvider и JwtAuthFilter из common читают этот префикс во всех сервисах.
pbl:
  security:
    jwt:
      # Тот же секрет, что в auth, directory и pbl, байт в байт. Без значения по умолчанию.
      secret: ${JWT_SECRET}
      expiration-ms: ${JWT_EXPIRATION_MS:900000} # 15 minutes

mp:
  trusted-proxies: ${TRUSTED_PROXIES:127.0.0.1,::1}
  credentials:
    # Ключ AES-256 паролей компаний к провайдеру (Р-93) — то же значение, что в directory и pbl: ecom
    # расшифровывает пароль компании для возврата и списания заказа выписки (Р-124). Без умолчания.
    encryption-key: ${CREDENTIALS_ENCRYPTION_KEY}

server:
  port: ${SERVER_PORT:8083}

management:
  server:
    # Actuator на своём порту и только на петле, как у остальных сервисов.
    port: ${MANAGEMENT_PORT:9083}
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html

# Как в pbl: предохранитель клиента провайдера, у каждого сервиса свой (Р-122).
resilience4j:
  circuitbreaker:
    instances:
      acquiring:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000ms
        permittedNumberOfCallsInHalfOpenState: 3
        # Отказ шлюза конкретному терминалу — не сбой шлюза: не размыкает вызовы всем.
        ignoreExceptions:
          - az.millikart.txpg.AcquirerDeclinedException
  retry:
    instances:
      acquiring:
        maxAttempts: 3
        waitDuration: 500ms
        ignoreExceptions:
          - az.millikart.txpg.AcquirerDeclinedException
