server:
  port: 8082

spring:
  application:
    name: directory
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    # No default on purpose: the service must not start with a guessable database password.
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

directory:
  terminal-reconciliation:
    # Сверка статусов терминалов со слепком ecom (Р-66): здесь, потому что смена статуса в directory
    # ведёт и платёжные ссылки.
    enabled: ${DIRECTORY_TERMINAL_RECONCILIATION_ENABLED:true}
    cron: "${DIRECTORY_TERMINAL_RECONCILIATION_CRON:0 */15 * * * *}"

pbl:
  security:
    # Must be byte-for-byte the same value as in auth, pbl and ecom, otherwise tokens issued by auth
    # fail verification here. No default on purpose.
    jwt:
      secret: ${JWT_SECRET}
      # Lifetime is stamped by auth; kept in step with it to keep the four configurations identical (P1-13).
      expiration-ms: ${JWT_EXPIRATION_MS:900000} # 15 minutes

mp:
  # Whose X-Real-IP / X-Forwarded-For we trust; the same line as in auth, pbl and ecom (Р-103).
  trusted-proxies: ${TRUSTED_PROXIES:127.0.0.1,::1}
  credentials:
    # Ключ AES-256 для паролей компаний к провайдеру (Р-93): 32 байта в base64, одно значение в directory
    # и pbl — directory шифрует, pbl расшифровывает. Без значения по умолчанию намеренно (CredentialCipher).
    encryption-key: ${CREDENTIALS_ENCRYPTION_KEY}

management:
  server:
    # Loopback-only port instead of a token: probes have none to present.
    # Ports: auth 9081, directory 9082, pbl 9080, ecom 9083.
    port: ${MANAGEMENT_PORT:9082}
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      # Safe only because of the loopback binding above.
      show-details: always

springdoc:
  # Off by default: /v3/api-docs maps the whole API. SWAGGER_ENABLED=true only for acceptance testing
  # (project_docs/guides/deployment_guide.md).
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html

