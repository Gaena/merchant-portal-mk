server:
  port: 8081

spring:
  application:
    name: auth
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    # No default on purpose: the service must not start with a guessable database password.
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

auth:
  bootstrap:
    # First SYSTEM_ADMIN from BOOTSTRAP_ADMIN_*: on for a single start of a fresh installation only.
    enabled: ${AUTH_BOOTSTRAP_ENABLED:false}
  login:
    rate-limit:
      # Failed login attempts per client address (P3-Auth); a successful login clears only the
      # failures of its own login from the address (Р-117).
      # Counters live in memory (Р-27): a restart clears them.
      enabled: ${LOGIN_RATE_LIMIT_ENABLED:true}
      max-failures: ${LOGIN_RATE_LIMIT_MAX_FAILURES:10}
      window: ${LOGIN_RATE_LIMIT_WINDOW:PT15M}
  refresh:
    # Server-side idle bound of PCI DSS 8.2.8 (Р-99): each refresh rotates the token; the frontend
    # refreshes at most every 5 minutes, so 20 minutes never cuts off a live session.
    ttl: ${AUTH_REFRESH_TTL:PT20M}
    # Two tabs refreshing with one token within this window are a race, both are served; reuse of a
    # retired token outside it is theft and revokes the whole family.
    rotation-grace: ${AUTH_REFRESH_ROTATION_GRACE:PT10S}
    # Housekeeping only: expired tokens are refused anyway.
    cleanup-enabled: ${AUTH_REFRESH_CLEANUP_ENABLED:true}
    cleanup-cron: "${AUTH_REFRESH_CLEANUP_CRON:0 30 3 * * *}"
  inactivity:
    # PCI DSS 8.2.6 (Р-101): an ACTIVE account with no sign-in (or session refresh) for this long is
    # BLOCKED once a day. Administrators are not exempt; unblocking restarts the clock.
    enabled: ${AUTH_INACTIVITY_ENABLED:true}
    max-idle: ${AUTH_INACTIVITY_MAX_IDLE:P90D}
    cron: "${AUTH_INACTIVITY_CRON:0 45 3 * * *}"

mp:
  # Whose X-Real-IP / X-Forwarded-For we believe: our nginx over loopback. Other peers' headers are
  # ignored; empty value = never believe them. See ClientIp.
  trusted-proxies: ${TRUSTED_PROXIES:127.0.0.1,::1}

pbl:
  security:
    # HS256 signing key, the same in all four services. No default: a default puts the key into the
    # repository (P0-5).
    jwt:
      secret: ${JWT_SECRET}
      # Upper bound of access after logout, block or delete: the token is verified stateless, there
      # is no blacklist (P1-13). Raising it widens the revocation gap.
      expiration-ms: ${JWT_EXPIRATION_MS:900000} # 15 minutes

management:
  server:
    # Loopback-bound port: unreachable from outside, so no token (probes have none).
    # Ports: auth 9081, directory 9082, pbl 9080, ecom 9083.
    port: ${MANAGEMENT_PORT:9081}
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      # Safe because of the loopback binding above: details are visible from this machine only.
      show-details: always

springdoc:
  # Off in normal operation: /v3/api-docs is a full map of the API. SWAGGER_ENABLED=true only for
  # acceptance testing (project_docs/guides/deployment_guide.md); while off, SecurityConfig adds no
  # matchers for these paths.
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html

