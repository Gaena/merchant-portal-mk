plugins {
    id 'java-library'
    // Тестовый контейнер PostgreSQL объявляется один раз и достаётся всем модулям: две копии
    // одного базового класса однажды разойдутся версией образа, и половина тестов начнёт
    // проверять не ту СУБД, что другая половина.
    id 'java-test-fixtures'
    id 'io.spring.dependency-management'
}

dependencyManagement {
    imports {
        mavenBom("org.springframework.boot:spring-boot-dependencies:3.2.5") {
            // См. комментарий в корневом build.gradle: Docker Engine 29 не отвечает на версию
            // API, которой пользуется Testcontainers 1.19.x из BOM.
            bomProperty 'testcontainers.version', '1.20.6'
        }
    }
}

dependencies {
    api 'org.springframework.boot:spring-boot-starter-web'
    api 'org.springframework.boot:spring-boot-starter-security'
    // P2-14: the audit journal (az.millikart.common.audit) is an entity plus a repository, shared
    // by all three services. Every service already had this starter of its own.
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'org.springframework.boot:spring-boot-starter-cache'
    api 'org.springframework.boot:spring-boot-starter-actuator'
    api 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'
    api 'com.github.ben-manes.caffeine:caffeine:3.1.8'
    api 'org.springframework.data:spring-data-commons'
    api 'org.springframework:spring-tx'
    api 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // Версия Testcontainers задана явно и **выше** той, что приносит BOM Spring Boot 3.2.5
    // (1.19.7). Причина конкретная: 1.19.x обращается к Docker по версии API 1.32, а Docker
    // Engine 29 объявляет минимальной 1.40 и отвечает на такие запросы 400 — Testcontainers
    // при этом рапортует «Could not find a valid Docker environment», хотя докер работает.
    // Понижать докер ради BOM неразумно; обновится Boot — эту строку можно будет снять.
    testFixturesApi 'org.springframework.boot:spring-boot-testcontainers'
    testFixturesApi 'org.testcontainers:postgresql'
    testFixturesApi 'org.testcontainers:junit-jupiter'
    testFixturesApi 'org.springframework.boot:spring-boot-starter-test'
    testFixturesRuntimeOnly 'org.postgresql:postgresql'
}

tasks.named('test') {
    useJUnitPlatform()
}
